name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ----- Lint + type-check on every platform --------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: Run ruff
        run: ruff check src tests

  # ----- Tests on Linux (no MetaTrader5 available) --------------------------
  # These exercise the import graph, middleware, FastMCP server construction,
  # and the in-process Client. MetaTrader5 itself is stubbed.
  test-linux:
    name: Tests (ubuntu, no MT5)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps (incl. TOON)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[toon,test]
      - name: Run pytest
        run: pytest -q --color=yes

  # ----- Tests on Windows with the real MetaTrader5 dependency installed --
  # This job only exercises the modules that do NOT import MetaTrader5 at
  # import time (connection.py, executor.py, handlers.py all do, so they
  # are guarded by the @pytest.mark.mt5 marker and skipped here).
  test-windows:
    name: Tests (windows, MT5 stubbed)
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          pip install pytest pytest-asyncio
      - name: Run pytest (skip mt5 marker)
        run: pytest -q --color=yes -m "not mt5"
