[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-mcp"
version = "0.6.3"
description = "Read-only MCP server for MetaTrader 5, built on the FastMCP v3 framework with server-decided TOON output encoding for tabular LLM payloads."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Cloudmeru"},
]
keywords = [
    "metatrader",
    "mt5",
    "mcp",
    "trading",
    "forex",
    "llm",
    "ai",
    "model-context-protocol",
    "fastmcp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # FastMCP v3 — depend on the real package, not the empty meta.
    # See https://github.com/PrefectHQ/fastmcp/issues/4207 — depending on
    # `fastmcp` (the empty meta-package) can trigger a pip install dance
    # that wipes the fastmcp/__init__.py files. `fastmcp-slim[server]`
    # provides everything we need and bypasses the issue.
    "fastmcp-slim[server]>=3.4,<4",
    # MetaTrader5 is a Windows-only wheel; gate it so pip doesn't try to
    # install on Linux/macOS (where no wheel exists). The runtime check
    # in ``mt5_mcp.connection`` will surface a clear error when the
    # tools are actually invoked on a non-Windows host.
    "MetaTrader5>=5.0.0; sys_platform == 'win32'",
    # Forecasting + ML signals (still optional-feeling, but pulled in
    # by ``mt5_analyze(forecast=...)``. Pin majors loosely so a future
    # prophet/xgboost major bump doesn't break the install silently.
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "ta>=0.11.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "prophet>=1.0.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    # ASGI server pieces used by ``mt5-mcp --transport http``.
    # starlette/httpx/anyio are already transitively required by
    # fastmcp-slim[server] but we list them explicitly so ``pip
    # check`` and the docs reflect the full surface.
    "uvicorn>=0.27.0",
    "starlette>=0.36.0",
    "httpx>=0.27.0",
    "anyio>=4.0",
]

[project.urls]
Homepage = "https://github.com/Cloudmeru/Metatrader-5-MCP-Server"
Repository = "https://github.com/Cloudmeru/Metatrader-5-MCP-Server"
Changelog = "https://github.com/Cloudmeru/Metatrader-5-MCP-Server/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Cloudmeru/Metatrader-5-MCP-Server/blob/main/USAGE.md"

[project.scripts]
mt5-mcp = "mt5_mcp.__main__:main"

[project.optional-dependencies]
toon = [
    # Official TOON encoder/decoder (token-efficient JSON for LLMs).
    # Pinned to the GitHub release tag — the matching PyPI version is a
    # stub (0.1.0 with NotImplementedError). Real implementation lives
    # at toon-format/toon-python and ships from the project's GitHub
    # Releases. ``v0.9.0-beta.1`` is the only published tag as of the
    # v0.6.3 release.
    "toon_format @ https://github.com/toon-format/toon-python/archive/refs/tags/v0.9.0-beta.1.tar.gz",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
    "tiktoken>=0.7",
    # ``pandas.DataFrame.to_markdown`` (used by ``mt5_mcp.executor``) is
    # an optional pandas feature that requires the ``tabulate`` wheel.
    # Pull it in explicitly so CI runs the formatter tests.
    "tabulate>=0.9",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
ignore = ["E402", "BLE001", "TRY401"]  # E402: top-level imports after sys.path setup in tests
                             # BLE001: ``except Exception`` is intentional in
                             #         top-level smoke-test scripts that must
                             #         keep running even when one block fails.
                             # TRY401: we prefer the exception string in the log
                             #         line for grep-ability in production logs.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "mt5: tests that require a live MetaTrader 5 terminal (skip on CI without MT5)",
]

[tool.coverage.run]
source = ["src/mt5_mcp"]
omit = ["*/tests/*", "*/__pycache__/*"]
